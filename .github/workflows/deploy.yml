name: Build & deploy

# Chaque nuit : télécharge l'export public d'Inducks, reconstruit la base, la découpe en
# tranches et publie le site avec ses données sur Cloudflare Pages
# (https://inducksbutbetter-demo.pages.dev). À chaque poussée sur main : même chose, en
# réutilisant la base du jour si elle est déjà construite.
#
# Garde-fous :
#   - une base qui échoue aux contrôles (scripts/check_db.py) n'est jamais publiée ;
#   - si inducks.org ne répond pas, la dernière base valide (cache) est republiée telle
#     quelle : le site ne tombe jamais à cause d'une panne en amont ;
#   - GitHub désactive les tâches planifiées d'un dépôt sans activité depuis 60 jours ; la
#     dernière étape réactive ce workflow à chaque exécution.

on:
  schedule:
    # Inducks régénère son export vers 04 h UTC.
    - cron: "35 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Forcer la reconstruction de la base"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ISV_URL: https://inducks.org/inducks/isv.tgz
  CHUNK_KIB: "256"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      dump: ${{ steps.isv.outputs.dump }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier types et tests
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: Compiler le site
        run: pnpm run build

      # --- Données -------------------------------------------------------------------
      - name: Date du jour
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # La base du jour est réutilisée si le script de construction n'a pas changé.
      - name: Base en cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/inducks.sqlite
          key: db-${{ hashFiles('scripts/build_db.py') }}-${{ steps.day.outputs.day }}
          restore-keys: |
            db-${{ hashFiles('scripts/build_db.py') }}-
            db-

      # La clé enregistrée porte le numéro d'exécution : on compare donc le préfixe (même
      # script, même jour) pour savoir si la base restaurée est celle du jour.
      - name: Base du jour déjà construite ?
        id: fresh
        run: |
          MATCHED="${{ steps.cache.outputs.cache-matched-key }}"
          WANTED="db-${{ hashFiles('scripts/build_db.py') }}-${{ steps.day.outputs.day }}"
          if [ -f data/inducks.sqlite ] && [ "${MATCHED#"$WANTED"}" != "$MATCHED" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Base du jour réutilisée ($MATCHED)"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Télécharger l'export Inducks
        id: isv
        if: steps.fresh.outputs.hit != 'true' || inputs.rebuild
        continue-on-error: true
        run: |
          mkdir -p data/isv
          curl --fail --silent --show-error --location --retry 4 --retry-delay 20 \
            --user-agent "InducksButBetter-builder (+https://github.com/${{ github.repository }})" \
            --dump-header data/headers.txt --output data/isv.tgz "$ISV_URL"
          # Anubis peut répondre 200 avec une page HTML : on vérifie que c'est bien une archive.
          gzip -t data/isv.tgz
          tar -xzf data/isv.tgz -C data/isv --strip-components=1
          COUNT=$(ls data/isv/*.isv | wc -l)
          echo "$COUNT fichiers ISV, $(du -sh data/isv | cut -f1)"
          test "$COUNT" -ge 60
          DUMP=$(grep -i '^last-modified:' data/headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')
          DUMP=$(date -u -d "$DUMP" +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)
          echo "dump=$DUMP" >> "$GITHUB_OUTPUT"

      - name: Construire la base
        id: build
        if: steps.isv.outcome == 'success'
        run: |
          python scripts/build_db.py data/isv data/new.sqlite --staging data/staging.sqlite \
            --dump-date "${{ steps.isv.outputs.dump }}"
          python scripts/check_db.py data/new.sqlite
          mv data/new.sqlite data/inducks.sqlite

      - name: Mettre la base en cache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/inducks.sqlite
          key: db-${{ hashFiles('scripts/build_db.py') }}-${{ steps.day.outputs.day }}-${{ github.run_id }}

      - name: Vérifier la base publiée
        run: |
          test -f data/inducks.sqlite || { echo "::error::Aucune base disponible (ni neuve, ni en cache)"; exit 1; }
          if [ "${{ steps.isv.outcome }}" = "failure" ]; then
            echo "::warning::inducks.org injoignable : la dernière base valide est republiée."
          fi
          python scripts/check_db.py data/inducks.sqlite

      - name: Découper la base dans le site
        run: |
          python scripts/split_db.py data/inducks.sqlite dist/db --chunk-kib "$CHUNK_KIB"
          # Titres et images des fiches pour les aperçus de liens (functions/_lib/og.ts).
          python scripts/og_index.py data/inducks.sqlite dist/og
          du -sh dist dist/db
          echo "$(find dist -type f | wc -l) fichiers"

      # Le site compilé et sa base, ouverts dans Chromium : les écrans principaux doivent
      # s'afficher sans erreur JavaScript, sinon rien n'est publié.
      - name: Tester le site dans un navigateur
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/ > /dev/null || { cat preview.log; exit 1; }
          node scripts/smoke.mjs http://127.0.0.1:4173

      - name: Conserver le site construit
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            functions
            wrangler.toml
          retention-days: 3
          include-hidden-files: true

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le projet peut ne pas exister encore : la création échoue sans dommage s'il existe.
      - name: Créer le projet Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create inducksbutbetter-demo --production-branch=main

      # Avec la liaison Workers AI (assistant SQL sans clé). Si le jeton n'a pas les droits
      # nécessaires, on republie sans elle : le site reste en ligne et l'assistant se rabat
      # sur un service public.
      - name: Publier sur Cloudflare Pages
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=inducksbutbetter-demo --branch=main --commit-dirty=true

      - name: Publier sans la liaison IA
        if: steps.deploy.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mv wrangler.toml wrangler.toml.off
          npx --yes wrangler@4 pages deploy dist --project-name=inducksbutbetter-demo --branch=main --commit-dirty=true

  # Miroir GitHub Pages, actif dès que Pages est activé dans les réglages du dépôt
  # (Settings > Pages > Source : GitHub Actions). Sans activation, cette étape échoue seule.
  # Le miroir GitHub Pages ne part que si Pages est activé dans les réglages du dépôt
  # (Settings > Pages > Source : GitHub Actions). Sinon la tâche est simplement sautée.
  pages-check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages n'est pas activé (source : GitHub Actions), miroir sauté."
          fi

  github-pages:
    needs: [build, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Le site est servi sous /<dépôt>/ : on le recompile avec ce préfixe et on reprend les
      # tranches de base déjà découpées.
      - name: Compiler pour GitHub Pages
        run: |
          pnpm install --frozen-lockfile
          VITE_BASE="/${{ github.event.repository.name }}/" pnpm exec vite build
          rm -rf dist/db && mv site/dist/db dist/db
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: pages
        uses: actions/deploy-pages@v4

  keepalive:
    needs: [cloudflare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Garder la tâche planifiée active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

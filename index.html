<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InducksButBetter</title>
    <meta name="description" content="Cherchez parmi toutes les bandes dessinées Disney indexées par Inducks : histoires, numéros, auteurs, personnages. Directement dans le navigateur, sans rien télécharger." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172e" media="(prefers-color-scheme: dark)" />
    <!-- Couvertures et vignettes viennent d'inducks.org : connexion ouverte d'avance. -->
    <link rel="preconnect" href="https://inducks.org" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InducksButBetter" />
    <meta property="og:description" content="Toutes les BD Disney du monde, à portée de recherche." />
    <meta property="og:image" content="https://inducksbutbetter-demo.pages.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Thème appliqué avant le premier rendu, sans flash.
      try {
        var s = JSON.parse(localStorage.getItem("ibb.settings") || "{}");
        if (s.theme === "dark" || s.theme === "light") document.documentElement.setAttribute("data-theme", s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>InducksButBetter a besoin de JavaScript pour interroger la base Inducks.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
